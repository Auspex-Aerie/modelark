name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # Core suite — pure Python, fast, no browser. Excludes the E2E (its own job below).
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.12" ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: System deps (git-annex for the storage-layer tests)
        run: sudo apt-get update && sudo apt-get install -y git-annex

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite (excluding E2E)
        # INC-026: collect with pytest. The previous `python "$t"` loop ran each file as a
        # script, which only *defines* `def test_*` functions — 161 of 632 never executed.
        # test_e2e_portal.py keeps its own job: it has a __main__ entry point and no test fns.
        run: pytest -q --ignore=tests/test_e2e_portal.py

      - name: Static correctness checks
        run: ruff check modelark scripts tests

      - name: Build source archive and wheel from that archive
        if: matrix.python-version == '3.12'
        run: python -m build --outdir /tmp/modelark-wheel

      - name: Check source archive includes public documentation and linked assets
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          archives = list(Path('/tmp/modelark-wheel').glob('modelark-*.tar.gz'))
          assert len(archives) == 1, archives
          required = [Path(p) for p in ('README.md', 'CHANGELOG.md', 'SECURITY.md', 'CODE_OF_CONDUCT.md')]
          required += [p for folder in ('docs', 'contributing') for p in Path(folder).rglob('*') if p.is_file()]
          with tarfile.open(archives[0]) as archive:
              prefix = archives[0].name.removesuffix('.tar.gz') + '/'
              for path in required:
                  member = archive.extractfile(prefix + path.as_posix())
                  assert member is not None and member.read() == path.read_bytes(), path
              assert not any('/claudedocs/' in name for name in archive.getnames())
          print(f'Validated {len(required)} public documentation files and assets in source archive')
          PY

      - name: Smoke-test the installed wheel and packaged resources
        if: matrix.python-version == '3.12'
        run: |
          pip uninstall -y modelark
          pip install --no-deps /tmp/modelark-wheel/modelark-*.whl
          cd /tmp
          python -c "import tempfile; from pathlib import Path; from importlib.metadata import distribution; import scripts; from modelark import wishlist; from modelark.core import db; from modelark.web import server; d=tempfile.mkdtemp(); db.configure(d); c=db.connect(_bootstrapping=True); c.close(); assert wishlist.download()['max_24h_gb']==1000; assert (server.STATIC/'index.html').is_file(); assert db.DB_PATH.is_file() and Path(d) in db.DB_PATH.parents; assert scripts.__file__; names={e.name for e in distribution('modelark').entry_points}; assert {'modelark-migrate','modelark-deploy'} <= names"
          python "$GITHUB_WORKSPACE/tests/test_runtime_paths.py"
          python -m scripts.phase4_wheel_migration_smoke
          python -c "import re; from importlib.metadata import metadata, requires; m=metadata('modelark'); r=requires('modelark') or []; name=lambda x: re.match(r'[A-Za-z0-9._-]+', x).group(0); canon=lambda x: re.sub(r'[-_.]+','-',name(x).lower()); assert m['License-Expression']=='Apache-2.0'; assert m['Project-URL']; assert not any(canon(x) in {'duckdb','hf-transfer'} and 'extra ==' not in x for x in r)"
          modelark-migrate --help
          modelark-deploy --source "$GITHUB_WORKSPACE" --venv /tmp/modelark-deploy-venv --dry-run

  # Browser E2E — boots the portal on a seeded catalog and drives it headless with Playwright.
  # Separate job so the core suite stays zero-dep and fast; this one pays for a browser install.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System deps (git-annex)
        run: sudo apt-get update && sudo apt-get install -y git-annex

      - name: Install (+ Playwright Chromium)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          playwright install --with-deps chromium

      - name: Portal E2E (headless)
        run: python tests/test_e2e_portal.py
